[tool.poetry]
name = "s3-agent-memory"
version = "0.1.0"
description = "Long-term memory for AI agents stored as plain JSON objects in any S3-compatible bucket: no database, no vector DB service. BM25 + optional local embeddings, optimistic concurrency with S3 conditional writes, an MCP server and a LangGraph store."
authors = ["Martín Castro Álvarez <martincastro.10.5@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinCastroAlvarez/s3-agent-memory"
repository = "https://github.com/MartinCastroAlvarez/s3-agent-memory"
documentation = "https://github.com/MartinCastroAlvarez/s3-agent-memory#readme"
keywords = [
    "agent-memory",
    "long-term-memory",
    "s3",
    "minio",
    "mcp",
    "model-context-protocol",
    "langgraph",
    "bm25",
    "ai-agents",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
packages = [{ include = "s3_agent_memory" }]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
s3-agent-memory = "s3_agent_memory.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
mcp = "^2.3"
boto3 = { version = "^1.35.50", optional = true }
numpy = { version = ">=1.26", optional = true }
fastembed = { version = ">=0.5", optional = true }
langgraph = { version = "^1.0", optional = true }

[tool.poetry.extras]
s3 = ["boto3"]
# numpy for the vector shard; bring any local embedder (sentence-transformers, ...).
embeddings = ["numpy"]
# numpy + fastembed (ONNX, CPU): the ready-made local embedder.
fastembed = ["numpy", "fastembed"]
langgraph = ["langgraph"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = ">=5,<8"
moto = { version = "^5.1", extras = ["s3"] }
ruff = ">=0.6"
mypy = "^1.11 || ^2.0"
bandit = "^1.7"
pip-audit = "^2.7"
boto3-stubs = { version = "^1.35", extras = ["s3"] }

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Ruff — lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit-style security
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RET",          # returns
    "PIE",          # misc
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S603", "E501"]
"examples/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["s3_agent_memory", "tests"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--doctest-modules",
    "--cov=s3_agent_memory",
    "--cov-report=term-missing",
]
testpaths = ["tests", "s3_agent_memory"]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*", "sentence_transformers", "sentence_transformers.*", "moto", "moto.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["s3_agent_memory"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
omit = [
    "s3_agent_memory/__main__.py",
]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv", "build", "dist"]
